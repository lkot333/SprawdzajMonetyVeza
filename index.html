<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kontrola monety</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #101010;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin: 20px 0;
}

.panel {
    width: min(1100px, 95%);
    margin: 15px auto;
    padding: 20px;
    background: #202020;
    border-radius: 16px;
}

select,
button,
input {
    padding: 10px;
    margin: 5px;
    border: 0;
    border-radius: 8px;
    font-size: 16px;
}

    background: #444;
}

#video {
    width: min(1000px, 95%);

}

    width: min(1000px, 95%);

.templates {

canvas {

@media(max-width:700px) {

<body>

<h1>🪙 Kontrola monety</h1>

<div class="panel">

    <h2>📷 Kamera</h2>

    <select id="cameraSelect">
        <option value="">Wybierz kamerę...</option>
    </select>

    <br>

    <button id="permission">

    </button>

        %

        Oczekiwanie...
    </div>

</div>

<video
    id="video"
    autoplay

</video>

<div id="result">
    OCZEKIWANIE...
</div>

<div id="info">
    Najlepsze podobieństwo: 0%
</div>

<h2>🖼️ Wzorce</h2>

<div class="templates">

    <div class="template">
        <h3>Wzorzec 1</h3>
        <img id="preview1">
        <input id="file1" type="file" accept="image/*">
        <div id="score1" class="score">0%</div>

        <div class="bar">
            <div id="bar1" class="bar-inner"></div>
        </div>
    </div>

    <div class="template">
        <h3>Wzorzec 2</h3>
        <img id="preview2">
        <input id="file2" type="file" accept="image/*">
        <div id="score2" class="score">0%</div>

        <div class="bar">
            <div id="bar2" class="bar-inner"></div>
        </div>
    </div>

    <div class="template">
        <h3>Wzorzec 3</h3>
        <img id="preview3">
        <input id="file3" type="file" accept="image/*">
        <div id="score3" class="score">0%</div>

        <div class="bar">
            <div id="bar3" class="bar-inner"></div>
        </div>
    </div>

    <div class="template">
        <h3>Wzorzec 4</h3>
        <img id="preview4">
        <input id="file4" type="file" accept="image/*">
        <div id="score4" class="score">0%</div>

        <div class="bar">
            <div id="bar4" class="bar-inner"></div>
        </div>
    </div>

</div>

<canvas id="cameraCanvas"></canvas>


<script>

const video =
    document.getElementById("video");

const cameraSelect =
    document.getElementById("cameraSelect");

const result =
    document.getElementById("result");

const info =
    document.getElementById("info");

const statusText =
    document.getElementById("status");

const thresholdInput =
    document.getElementById("threshold");

const cameraCanvas =
    document.getElementById("cameraCanvas");

const cameraCtx =
    cameraCanvas.getContext("2d", {
        willReadFrequently: true
    });

let stream = null;

const SIZE = 32;

const templates = [
    null,
    null,
    null,
    null
];


/*
==================================================
POMOCNICZE
==================================================
*/

function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
}


/*
==================================================
OBRAZ -> SKALA SZAROŚCI
==================================================
*/

function grayscale(data) {

    const result = new Float32Array(
        data.width * data.height
    );

    let p = 0;

    for (
        let i = 0;
        i < data.data.length;
        i += 4
    ) {

        const r = data.data[i];
        const g = data.data[i + 1];
        const b = data.data[i + 2];

        result[p++] =
            r * 0.299 +
            g * 0.587 +
            b * 0.114;
    }

    return result;
}


/*
==================================================
NORMALIZACJA JASNOŚCI

Dzięki temu zmiana oświetlenia
nie rozwala wyniku tak łatwo.
==================================================
*/

function normalize(array) {

    let sum = 0;

    for (const value of array) {
        sum += value;
    }

    const mean =
        sum / array.length;

    let variance = 0;

    for (const value of array) {

        const d =
            value - mean;

        variance += d * d;
    }

    const deviation =
        Math.sqrt(
            variance / array.length
        ) || 1;

    const output =
        new Float32Array(
            array.length
        );

    for (let i = 0; i < array.length; i++) {

        output[i] =
            (array[i] - mean) /
            deviation;
    }

    return output;
}


/*
==================================================
OBRÓT WZORCA

Tworzymy 0°, 90°, 180° i 270°.
==================================================
*/

function rotatePattern(pattern, angle) {

    const output =
        new Float32Array(
            SIZE * SIZE
        );

    for (let y = 0; y < SIZE; y++) {

        for (let x = 0; x < SIZE; x++) {

            let sx;
            let sy;

            if (angle === 0) {

                sx = x;
                sy = y;

            } else if (angle === 90) {

                sx = y;
                sy = SIZE - 1 - x;

            } else if (angle === 180) {

                sx = SIZE - 1 - x;
                sy = SIZE - 1 - y;

            } else {

                sx = SIZE - 1 - y;
                sy = x;
            }

            output[
                y * SIZE + x
            ] =
                pattern[
                    sy * SIZE + sx
                ];
        }
    }

    return output;
}


/*
==================================================
WCZYTANIE WZORCA
==================================================
*/

function prepareTemplate(image) {

    const canvas =
        document.createElement("canvas");

    canvas.width = SIZE;
    canvas.height = SIZE;

    const ctx =
        canvas.getContext("2d", {
            willReadFrequently: true
        });

    ctx.drawImage(
        image,
        0,
        0,
        SIZE,
        SIZE
    );

    const pixels =
        ctx.getImageData(
            0,
            0,
            SIZE,
            SIZE
        );

    const gray =
        grayscale(pixels);

    const normalized =
        normalize(gray);

    return {

        rotations: [
            rotatePattern(normalized, 0),
            rotatePattern(normalized, 90),
            rotatePattern(normalized, 180),
            rotatePattern(normalized, 270)
        ]
    };
}


/*
==================================================
WCZYTANIE 4 WZORCÓW
==================================================
*/

for (let n = 1; n <= 4; n++) {

    const input =
        document.getElementById(
            "file" + n
        );

    const preview =
        document.getElementById(
            "preview" + n
        );

    input.addEventListener(
        "change",
        function () {

            const file =
                this.files[0];

            if (!file)
                return;

            const reader =
                new FileReader();

            reader.onload =
                function (event) {

                    preview.src =
                        event.target.result;

                    const image =
                        new Image();

                    image.onload =
                        function () {

                            templates[n - 1] =
                                prepareTemplate(
                                    image
                                );
                        };

                    image.src =
                        event.target.result;
                };

            reader.readAsDataURL(file);
        }
    );
}


/*
==================================================
KAMERY
==================================================
*/

async function loadCameras() {

    try {

        const devices =
            await navigator.mediaDevices
                .enumerateDevices();

        const cameras =
            devices.filter(
                device =>
                    device.kind ===
                    "videoinput"
            );

        cameraSelect.innerHTML = "";

        if (!cameras.length) {

            cameraSelect.innerHTML =
                "<option>Brak kamer</option>";

            return;
        }

        cameras.forEach(
            (camera, index) => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    camera.deviceId;

                option.textContent =
                    camera.label ||
                    "Kamera " +
                    (index + 1);

                cameraSelect.appendChild(
                    option
                );
            }
        );

        statusText.textContent =
            "Znaleziono kamer: " +
            cameras.length;

    } catch (error) {

        console.error(error);

        statusText.textContent =
            "Nie można pobrać kamer.";
    }
}


/*
==================================================
ZGODA
==================================================
*/

async function permission() {

    try {

        const temporary =
            await navigator.mediaDevices
                .getUserMedia({
                    video: true,
                    audio: false
                });

        temporary
            .getTracks()
            .forEach(track =>
                track.stop()
            );

        await loadCameras();

    } catch (error) {

        console.error(error);

        statusText.textContent =
            "Brak dostępu do kamery.";
    }
}


/*
==================================================
START
==================================================
*/

async function startCamera() {

    try {

        if (stream) {

            stream
                .getTracks()
                .forEach(track =>
                    track.stop()
                );
        }

        const deviceId =
            cameraSelect.value;

        if (!deviceId) {

            await permission();
            return;
        }

        stream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {
                        deviceId: {
                            exact: deviceId
                        },

                        width: {
                            ideal: 1280
                        },

                        height: {
                            ideal: 720
                        }
                    },

                    audio: false
                });

        video.srcObject =
            stream;

        statusText.textContent =
            "Kamera działa.";

    } catch (error) {

        console.error(error);

        statusText.textContent =
            error.message;
    }
}


/*
==================================================
STOP
==================================================
*/

function stopCamera() {

    if (stream) {

        stream
            .getTracks()
            .forEach(track =>
                track.stop()
            );

        stream = null;
    }

    video.srcObject = null;

    result.textContent =
        "KAMERA ZATRZYMANA";

    result.style.background =
        "#333";
}


/*
==================================================
PORÓWNANIE DWÓCH OBRAZÓW

Korelacja zamiast prostego odejmowania pikseli.
==================================================
*/

function similarity(a, b) {

    let sum = 0;

    let aa = 0;
    let bb = 0;

    for (let i = 0; i < a.length; i++) {

        sum += a[i] * b[i];

        aa += a[i] * a[i];

        bb += b[i] * b[i];
    }

    if (!aa || !bb)
        return 0;

    const correlation =
        sum /
        Math.sqrt(aa * bb);

    return clamp(
        ((correlation + 1) / 2) * 100,
        0,
        100
    );
}


/*
==================================================
WYCIĘCIE FRAGMENTU KAMERY
==================================================
*/

function getCameraPatch(
    source,
    x,
    y,
    width,
    height
) {

    const patchCanvas =
        document.createElement("canvas");

    patchCanvas.width = SIZE;
    patchCanvas.height = SIZE;

    const patchCtx =
        patchCanvas.getContext("2d", {
            willReadFrequently: true
        });

    patchCtx.drawImage(
        source,
        x,
        y,
        width,
        height,
        0,
        0,
        SIZE,
        SIZE
    );

    const pixels =
        patchCtx.getImageData(
            0,
            0,
            SIZE,
            SIZE
        );

    return normalize(
        grayscale(pixels)
    );
}


/*
==================================================
SZUKANIE W CAŁYM OBRAZIE

Przeszukujemy różne miejsca
i różne rozmiary.
==================================================
*/

function findBestMatch(template) {

    if (!template)
        return 0;

    const videoWidth =
        video.videoWidth;

    const videoHeight =
        video.videoHeight;

    if (!videoWidth || !videoHeight)
        return 0;

    /*
        Rozmiary fragmentu.
        Dzięki temu moneta może być
        bliżej albo dalej od kamery.
    */

    const scales = [
        0.25,
        0.35,
        0.50,
        0.65,
        0.80
    ];

    let best = 0;

    for (const scale of scales) {

        const patchWidth =
            videoWidth * scale;

        const patchHeight =
            patchWidth;

        if (
            patchWidth > videoWidth ||
            patchHeight > videoHeight
        )
            continue;

        /*
            Co kilka procent kadru.
            Nie sprawdzamy każdego piksela,
            bo byłoby to bardzo ciężkie dla CPU.
        */

        const stepX =
            Math.max(
                20,
                Math.floor(
                    videoWidth * 0.08
                )
            );

        const stepY =
            Math.max(
                20,
                Math.floor(
                    videoHeight * 0.08
                )
            );

        for (
            let y = 0;
            y <= videoHeight - patchHeight;
            y += stepY
        ) {

            for (
                let x = 0;
                x <= videoWidth - patchWidth;
                x += stepX
            ) {

                const patch =
                    getCameraPatch(
                        video,
                        x,
                        y,
                        patchWidth,
                        patchHeight
                    );

                /*
                    Sprawdzamy 4 obroty.
                */

                for (
                    const rotated
                    of template.rotations
                ) {

                    const score =
                        similarity(
                            patch,
                            rotated
                        );

                    if (score > best)
                        best = score;
                }
            }
        }
    }

    return best;
}


/*
==================================================
ANALIZA
==================================================
*/

let analyzing = false;

async function analyze() {

    if (
        stream &&
        video.readyState >= 2 &&
        !analyzing
    ) {

        analyzing = true;

        let bestScore = 0;
        let bestNumber = 0;

        for (let i = 0; i < 4; i++) {

            const score =
                findBestMatch(
                    templates[i]
                );

            const rounded =
                Math.round(score);

            document.getElementById(
                "score" + (i + 1)
            ).textContent =
                rounded + "%";

            document.getElementById(
                "bar" + (i + 1)
            ).style.width =
                rounded + "%";

            if (score > bestScore) {

                bestScore = score;
                bestNumber = i + 1;
            }
        }

        const threshold =
            Number(
                thresholdInput.value
            );

        info.textContent =
            "Najlepsze podobieństwo: " +
            Math.round(bestScore) +
            "% — wzorzec " +
            bestNumber;

        if (
            bestNumber > 0 &&
            bestScore >= threshold
        ) {

            result.textContent =
                "ODBIERZ MONETĘ I PRZEJDŹ";

            result.style.background =
                "#087f23";

        } else {

            result.textContent =
                "SPADAJ STĄD";

            result.style.background =
                "#8b0000";
        }

        analyzing = false;
    }

    /*
        Analizujemy mniej więcej 4 razy na sekundę,
        żeby nie zajechać procesora.
    */

    setTimeout(
        () => requestAnimationFrame(analyze),
        250
    );
}


/*
==================================================
PRZYCISKI
==================================================
*/

document
    .getElementById("permission")
    .onclick =
    permission;

document
    .getElementById("refresh")
    .onclick =
    permission;

document
    .getElementById("start")
    .onclick =
    startCamera;

document
    .getElementById("stop")
    .onclick =
    stopCamera;

cameraSelect.addEventListener(
    "change",
    () => {

        if (stream)
            startCamera();
    }
);


/*
==================================================
START
==================================================
*/

permission();

analyze();

</script>

</body>
</html>
