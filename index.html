<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test monety</title>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin: 20px;
}

.panel {
    width: min(900px, 94%);
    margin: 15px auto;
    padding: 20px;
    background: #222;
    border-radius: 15px;
}

select,
button,
input {
    padding: 10px;
    margin: 6px;
    border: 0;
    border-radius: 8px;
    font-size: 16px;
}

button {
    background: #444;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #555;
}

#video {
    width: min(900px, 94%);
    margin-top: 20px;
    border-radius: 15px;
    background: black;
}

#result {
    width: min(900px, 94%);
    margin: 20px auto;
    padding: 25px;
    border-radius: 15px;
    font-size: 32px;
    font-weight: bold;
    background: #333;
}

#stats {
    width: min(900px, 94%);
    margin: 15px auto;
    padding: 20px;
    background: #222;
    border-radius: 15px;
    font-size: 19px;
    line-height: 1.8;
}

.good {
    color: #42e878;
}

.bad {
    color: #ff5555;
}

.warning {
    color: #ffd447;
}

#preview {
    width: 220px;
    height: 220px;
    object-fit: contain;
    background: black;
    border-radius: 10px;
    margin: 10px;
}

#status {
    color: #aaa;
    margin: 10px;
}

#loading {
    color: #ffd447;
}
</style>
</head>

<body>

<h1>🪙 Test rozpoznawania monety</h1>

<div class="panel">

    <div id="loading">
        Ładowanie OpenCV...
    </div>

    <h2>📷 Kamera</h2>

    <select id="cameraSelect">
        <option>Ładowanie kamer...</option>
    </select>

    <br>

    <button id="permission">
        🔓 Zezwól na kamery
    </button>

    <button id="start">
        ▶ Uruchom
    </button>

    <button id="stop">
        ⏹ Zatrzymaj
    </button>

    <h2>🪙 Wzorzec monety</h2>

    <input
        id="templateFile"
        type="file"
        accept="image/*"
    >

    <br>

    <img
        id="preview"
        alt="Wzorzec"
    >

    <div id="status">
        Brak wzorca.
    </div>

</div>

<video
    id="video"
    autoplay
    muted
    playsinline>
</video>

<div id="result">
    OCZEKIWANIE...
</div>

<div id="stats">

    <div>
        Cechy wzorca:
        <b id="templateFeatures">0</b>
    </div>

    <div>
        Cechy kamery:
        <b id="cameraFeatures">0</b>
    </div>

    <div>
        Wszystkie dopasowania:
        <b id="allMatches">0</b>
    </div>

    <div>
        Dobre dopasowania:
        <b id="goodMatches">0</b>
    </div>

    <div>
        Procent wzorca:
        <b id="percentage">0%</b>
    </div>

    <div>
        Próg:
        <b>30%</b>
    </div>

</div>


<!-- OpenCV.js -->
<script src="https://docs.opencv.org/4.x/opencv.js"></script>


<script>

let cvReady = false;

let stream = null;

let templateMat = null;

let templateKeypoints = null;

let templateDescriptors = null;

let orb = null;


/* ========================================
   ELEMENTY
======================================== */

const video =
    document.getElementById("video");

const cameraSelect =
    document.getElementById("cameraSelect");

const result =
    document.getElementById("result");

const statusText =
    document.getElementById("status");

const loading =
    document.getElementById("loading");

const preview =
    document.getElementById("preview");

const templateFeatures =
    document.getElementById("templateFeatures");

const cameraFeatures =
    document.getElementById("cameraFeatures");

const allMatches =
    document.getElementById("allMatches");

const goodMatches =
    document.getElementById("goodMatches");

const percentage =
    document.getElementById("percentage");


/* ========================================
   USTAWIENIA
======================================== */

/*
   Ile procent cech wzorca musi pasować,
   żeby uznać obraz za monetę.
*/
const MATCH_THRESHOLD = 30;


/*
   Test Lowe'a.

   0.95 = bardziej tolerancyjny
   0.75 = bardzo restrykcyjny
*/
const LOWE_RATIO = 0.95;


/* ========================================
   OPENCV
======================================== */

function openCvReady() {

    cvReady = true;

    loading.textContent =
        "OpenCV załadowane ✔";

    loading.className =
        "good";
}

if (typeof cv !== "undefined") {

    if (cv.getBuildInformation) {

        openCvReady();

    } else {

        cv.onRuntimeInitialized =
            openCvReady;
    }
}


/* ========================================
   ORB
======================================== */

function createORB() {

    if (orb)
        return;

    orb = new cv.ORB(
        2000,
        1.2,
        8,
        31,
        0,
        2,
        cv.ORB_HARRIS_SCORE,
        31,
        20
    );
}


/* ========================================
   KAMERY
======================================== */

async function loadCameras() {

    try {

        const devices =
            await navigator.mediaDevices
                .enumerateDevices();

        const cameras =
            devices.filter(
                device =>
                    device.kind ===
                    "videoinput"
            );

        cameraSelect.innerHTML = "";

        if (cameras.length === 0) {

            cameraSelect.innerHTML =
                "<option>Brak kamer</option>";

            statusText.textContent =
                "Nie znaleziono kamer.";

            return;
        }

        cameras.forEach(
            (camera, index) => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    camera.deviceId;

                option.textContent =
                    camera.label ||
                    "Kamera " +
                    (index + 1);

                cameraSelect.appendChild(
                    option
                );
            }
        );

        statusText.textContent =
            "Znaleziono kamer: " +
            cameras.length;

    } catch (error) {

        console.error(error);

        statusText.textContent =
            "Błąd pobierania kamer.";
    }
}


/* ========================================
   ZGODA NA KAMERĘ
======================================== */

async function permission() {

    try {

        const temporaryStream =
            await navigator.mediaDevices
                .getUserMedia({
                    video: true,
                    audio: false
                });

        temporaryStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        await loadCameras();

    } catch (error) {

        console.error(error);

        statusText.textContent =
            "Brak dostępu do kamery.";
    }
}


/* ========================================
   START KAMERY
======================================== */

async function startCamera() {

    try {

        if (stream) {

            stream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );
        }

        if (!cameraSelect.value) {

            statusText.textContent =
                "Najpierw wybierz kamerę.";

            return;
        }

        stream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        deviceId: {
                            exact:
                                cameraSelect.value
                        },

                        width: {
                            ideal: 1280
                        },

                        height: {
                            ideal: 720
                        }
                    },

                    audio: false
                });

        video.srcObject =
            stream;

        statusText.textContent =
            "Kamera działa ✔";

    } catch (error) {

        console.error(error);

        statusText.textContent =
            "Błąd kamery: " +
            error.message;
    }
}


/* ========================================
   STOP KAMERY
======================================== */

function stopCamera() {

    if (stream) {

        stream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        stream = null;
    }

    video.srcObject = null;

    result.textContent =
        "KAMERA ZATRZYMANA";

    result.style.background =
        "#333";
}


/* ========================================
   WCZYTYWANIE WZORCA
======================================== */

document
    .getElementById("templateFile")
    .addEventListener(
        "change",
        function () {

            const file =
                this.files[0];

            if (!file)
                return;

            const reader =
                new FileReader();

            reader.onload =
                function (event) {

                    preview.src =
                        event.target.result;

                    const image =
                        new Image();

                    image.onload =
                        function () {

                            if (!cvReady) {

                                statusText.textContent =
                                    "OpenCV jeszcze się ładuje.";

                                return;
                            }

                            createORB();

                            /*
                               Canvas wzorca.
                            */

                            const canvas =
                                document.createElement(
                                    "canvas"
                                );

                            canvas.width =
                                image.width;

                            canvas.height =
                                image.height;

                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );

                            ctx.drawImage(
                                image,
                                0,
                                0
                            );


                            /*
                               Usuwamy poprzedni wzorzec.
                            */

                            if (templateMat) {

                                templateMat.delete();

                                templateMat =
                                    null;
                            }

                            if (templateKeypoints) {

                                templateKeypoints.delete();

                                templateKeypoints =
                                    null;
                            }

                            if (templateDescriptors) {

                                templateDescriptors.delete();

                                templateDescriptors =
                                    null;
                            }


                            /*
                               Wczytujemy obraz.
                            */

                            const original =
                                cv.imread(canvas);


                            /*
                               Skala szarości.
                            */

                            templateMat =
                                new cv.Mat();

                            cv.cvtColor(
                                original,
                                templateMat,
                                cv.COLOR_RGBA2GRAY
                            );

                            original.delete();


                            /*
                               Wykrywamy cechy wzorca.
                            */

                            templateKeypoints =
                                new cv.KeyPointVector();

                            templateDescriptors =
                                new cv.Mat();

                            orb.detectAndCompute(
                                templateMat,
                                new cv.Mat(),
                                templateKeypoints,
                                templateDescriptors
                            );


                            /*
                               Pokazujemy liczbę cech.
                            */

                            const count =
                                templateKeypoints.size();

                            templateFeatures.textContent =
                                count;

                            statusText.textContent =
                                "Wzorzec gotowy ✔";

                            console.log(
                                "Cechy wzorca:",
                                count
                            );
                        };

                    image.src =
                        event.target.result;
                };

            reader.readAsDataURL(file);
        }
    );


/* ========================================
   CANVAS KAMERY
======================================== */

const cameraCanvas =
    document.createElement(
        "canvas"
    );

cameraCanvas.width = 640;
cameraCanvas.height = 480;

const cameraCtx =
    cameraCanvas.getContext(
        "2d"
    );


/* ========================================
   ANALIZA
======================================== */

function analyze() {

    /*
       Nie analizujemy, jeśli nie ma
       jeszcze wszystkiego.
    */

    if (
        !cvReady ||
        !stream ||
        !templateDescriptors ||
        video.readyState < 2
    ) {

        requestAnimationFrame(
            analyze
        );

        return;
    }


    /*
       Pobieramy obraz z kamery.
    */

    cameraCtx.drawImage(
        video,
        0,
        0,
        640,
        480
    );


    /*
       OpenCV odczytuje klatkę.
    */

    let frame =
        cv.imread(
            cameraCanvas
        );


    /*
       Skala szarości.
    */

    let gray =
        new cv.Mat();

    cv.cvtColor(
        frame,
        gray,
        cv.COLOR_RGBA2GRAY
    );

    frame.delete();


    /*
       Wykrywamy cechy obrazu
       z kamery.
    */

    const cameraKeypoints =
        new cv.KeyPointVector();

    const cameraDescriptors =
        new cv.Mat();

    orb.detectAndCompute(
        gray,
        new cv.Mat(),
        cameraKeypoints,
        cameraDescriptors
    );


    const cameraCount =
        cameraKeypoints.size();

    cameraFeatures.textContent =
        cameraCount;


    /*
       Kamera nie ma cech.
    */

    if (
        cameraDescriptors.empty()
    ) {

        allMatches.textContent =
            "0";

        goodMatches.textContent =
            "0";

        percentage.textContent =
            "0%";

        result.textContent =
            "SPADAJ STĄD";

        result.style.background =
            "#8b0000";


        gray.delete();

        cameraKeypoints.delete();

        cameraDescriptors.delete();


        setTimeout(
            () =>
                requestAnimationFrame(
                    analyze
                ),
            500
        );

        return;
    }


    /*
       Dopasowanie ORB.
    */

    const matcher =
        new cv.BFMatcher(
            cv.NORM_HAMMING,
            false
        );

    const matches =
        new cv.DMatchVectorVector();


    matcher.knnMatch(
        templateDescriptors,
        cameraDescriptors,
        matches,
        2
    );


    let good = 0;

    const total =
        matches.size();


    /*
       Filtr dopasowań.
    */

    for (
        let i = 0;
        i < matches.size();
        i++
    ) {

        const pair =
            matches.get(i);

        if (pair.size() < 2)
            continue;


        const first =
            pair.get(0);

        const second =
            pair.get(1);


        /*
           Teraz używamy 0.95,
           więc filtr jest znacznie
           bardziej tolerancyjny.
        */

        if (
            first.distance <
            LOWE_RATIO *
            second.distance
        ) {

            good++;
        }
    }


    /*
       Statystyki.
    */

    allMatches.textContent =
        total;

    goodMatches.textContent =
        good;


    /*
       Ile procent CECH WZORCA
       znaleźliśmy?
    */

    const templateCount =
        templateKeypoints.size();

    let percent = 0;

    if (templateCount > 0) {

        percent =
            (good / templateCount) *
            100;
    }

    percent =
        Math.min(
            100,
            percent
        );


    const rounded =
        Math.round(
            percent
        );

    percentage.textContent =
        rounded + "%";


    /*
       DECYZJA
    */

    if (
        percent >=
        MATCH_THRESHOLD
    ) {

        result.textContent =
            "🪙 ODBIERZ MONETĘ I PRZEJDŹ";

        result.style.background =
            "#087f23";

        result.className =
            "good";

    } else {

        result.textContent =
            "SPADAJ STĄD";

        result.style.background =
            "#8b0000";

        result.className =
            "bad";
    }


    /*
       Czyszczenie pamięci OpenCV.
    */

    matcher.delete();

    gray.delete();

    cameraKeypoints.delete();

    cameraDescriptors.delete();


    /*
       Następna klatka.
    */

    setTimeout(
        () =>
            requestAnimationFrame(
                analyze
            ),
        500
    );
}


/* ========================================
   PRZYCISKI
======================================== */

document
    .getElementById("permission")
    .onclick =
    permission;


document
    .getElementById("start")
    .onclick =
    startCamera;


document
    .getElementById("stop")
    .onclick =
    stopCamera;


/*
   Zmiana kamery
*/

cameraSelect.addEventListener(
    "change",
    function () {

        if (stream) {

            startCamera();
        }
    }
);


/* ========================================
   START
======================================== */

permission();

analyze();

</script>

</body>
</html>
