<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Test monety</title>

<style>

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin: 20px;
}

.panel {
    width: min(900px, 94%);
    margin: auto;
    background: #222;
    padding: 20px;
    border-radius: 15px;
}

select,
button,
input {
    padding: 10px;
    margin: 6px;
    border: 0;
    border-radius: 8px;
    font-size: 16px;
}

    background: #444;
    color: white;
    cursor: pointer;
}

    background: #555;
}

    width: min(900px, 94%);
    margin-top: 20px;
    border-radius: 15px;

}

#result {
    width: min(900px, 94%);
    margin: 20px auto;
    padding: 25px;

}

    font-size: 20px;
}

    color: #aaa;
    margin: 10px;
}

    width: 220px;

    object-fit: contain;
    background: black;

    margin: 10px;
}

    color: #ffcc00;
}

</style>
</head>

<body>

<h1>🪙 Test rozpoznawania monety</h1>

<div class="panel">

    <div id="loading">
        Ładowanie OpenCV...
    </div>

    <h2>📷 Kamera</h2>

    <select id="cameraSelect">
        <option>Ładowanie kamer...</option>
    </select>

    <br>

    <button id="permission">
        🔓 Zezwól na kamery
    </button>

    <button id="start">
        ▶ Uruchom
    </button>

    <button id="stop">
        ⏹ Zatrzymaj
    </button>

    <br><br>

    <h2>🪙 Wzorzec monety</h2>

    <input
        id="templateFile"
        type="file"
        accept="image/*"
    >

    <br>

    <img
        id="preview"
        alt="Wzorzec"
    >

    <div id="status">
        Brak wzorca.
    </div>

</div>

<video
    id="video"
    autoplay
    muted
    playsinline>
</video>

<div id="result">
    OCZEKIWANIE...
</div>

<div id="score">
    Dopasowane cechy: 0
</div>


<script src="https://docs.opencv.org/4.x/opencv.js"></script>

<script>

let cvReady = false;
let stream = null;
let templateMat = null;

const video =
    document.getElementById("video");

const cameraSelect =
    document.getElementById("cameraSelect");

const result =
    document.getElementById("result");

const scoreText =
    document.getElementById("score");

const statusText =
    document.getElementById("status");

const loading =
    document.getElementById("loading");

const preview =
    document.getElementById("preview");


/*
========================================
OPEN CV GOTOWE
========================================
*/

function onOpenCvReady() {

    cvReady = true;

    loading.textContent =
        "OpenCV załadowane ✔";

    loading.style.color =
        "#55dd77";
}

if (typeof cv !== "undefined") {

    if (cv.getBuildInformation) {

        onOpenCvReady();

    } else {

        cv.onRuntimeInitialized =
            onOpenCvReady;
    }
}


/*
========================================
KAMERY
========================================
*/

async function loadCameras() {

    try {

        const devices =
            await navigator.mediaDevices
                .enumerateDevices();

        const cameras =
            devices.filter(
                d =>
                    d.kind === "videoinput"
            );

        cameraSelect.innerHTML = "";

        if (cameras.length === 0) {

            cameraSelect.innerHTML =
                "<option>Brak kamer</option>";

            return;
        }

        cameras.forEach(
            (camera, index) => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    camera.deviceId;

                option.textContent =
                    camera.label ||
                    "Kamera " + (index + 1);

                cameraSelect.appendChild(
                    option
                );
            }
        );

        statusText.textContent =
            "Znaleziono " +
            cameras.length +
            " kamer.";

    } catch (error) {

        console.error(error);

        statusText.textContent =
            "Nie można pobrać kamer.";
    }
}


/*
========================================
ZGODA NA KAMERĘ
========================================
*/

async function permission() {

    try {

        const temp =
            await navigator.mediaDevices
                .getUserMedia({
                    video: true,
                    audio: false
                });

        temp
            .getTracks()
            .forEach(
                track => track.stop()
            );

        await loadCameras();

    } catch (error) {

        console.error(error);

        statusText.textContent =
            "Brak zgody na kamerę.";
    }
}


/*
========================================
URUCHOM KAMERĘ
========================================
*/

async function startCamera() {

    try {

        if (stream) {

            stream
                .getTracks()
                .forEach(
                    track => track.stop()
                );
        }

        stream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        deviceId: {
                            exact:
                                cameraSelect.value
                        },

                        width: {
                            ideal: 1280
                        },

                        height: {
                            ideal: 720
                        }
                    },

                    audio: false
                });

        video.srcObject =
            stream;

        statusText.textContent =
            "Kamera działa.";

    } catch (error) {

        console.error(error);

        statusText.textContent =
            error.message;
    }
}


/*
========================================
STOP
========================================
*/

function stopCamera() {

    if (stream) {

        stream
            .getTracks()
            .forEach(
                track => track.stop()
            );

        stream = null;
    }

    video.srcObject = null;

    result.textContent =
        "KAMERA ZATRZYMANA";

    result.style.background =
        "#333";
}


/*
========================================
WCZYTANIE WZORCA
========================================
*/

document
    .getElementById("templateFile")
    .addEventListener(
        "change",
        function () {

            const file =
                this.files[0];

            if (!file)
                return;

            const reader =
                new FileReader();

            reader.onload =
                function (event) {

                    preview.src =
                        event.target.result;

                    const image =
                        new Image();

                    image.onload =
                        function () {

                            if (!cvReady) {

                                statusText.textContent =
                                    "OpenCV jeszcze się ładuje.";

                                return;
                            }

                            /*
                                Wczytujemy wzorzec.
                            */

                            const canvas =
                                document.createElement(
                                    "canvas"
                                );

                            canvas.width =
                                image.width;

                            canvas.height =
                                image.height;

                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );

                            ctx.drawImage(
                                image,
                                0,
                                0
                            );

                            /*
                                Poprzedni wzorzec
                                usuwamy z pamięci.
                            */

                            if (templateMat) {

                                templateMat.delete();

                                templateMat = null;
                            }

                            templateMat =
                                cv.imread(
                                    canvas
                                );

                            /*
                                Skala szarości.
                            */

                            const gray =
                                new cv.Mat();

                            cv.cvtColor(
                                templateMat,
                                gray,
                                cv.COLOR_RGBA2GRAY
                            );

                            templateMat.delete();

                            templateMat =
                                gray;

                            statusText.textContent =
                                "Wzorzec gotowy ✔";
                        };

                    image.src =
                        event.target.result;
                };

            reader.readAsDataURL(file);
        }
    );


/*
========================================
ORB
========================================
*/

function detectFeatures(
    image
) {

    const orb =
        new cv.ORB();

    const keypoints =
        new cv.KeyPointVector();

    const descriptors =
        new cv.Mat();

    orb.detectAndCompute(
        image,
        new cv.Mat(),
        keypoints,
        descriptors
    );

    return {
        orb,
        keypoints,
        descriptors
    };
}


/*
========================================
PORÓWNANIE
========================================
*/

function compareWithTemplate(
    frame
) {

    if (
        !templateMat ||
        templateMat.empty()
    ) {

        return 0;
    }

    /*
        Wykrywamy cechy wzorca.
    */

    const template =
        detectFeatures(
            templateMat
        );

    /*
        Wykrywamy cechy aktualnego
        obrazu z kamery.
    */

    const current =
        detectFeatures(
            frame
        );

    if (
        template.descriptors.empty() ||
        current.descriptors.empty()
    ) {

        template.orb.delete();
        template.keypoints.delete();
        template.descriptors.delete();

        current.orb.delete();
        current.keypoints.delete();
        current.descriptors.delete();

        return 0;
    }

    /*
        BFMatcher:
        porównuje deskryptory ORB.
    */

    const matcher =
        new cv.BFMatcher(
            cv.NORM_HAMMING,
            false
        );

    const matches =
        new cv.DMatchVectorVector();

    matcher.knnMatch(
        template.descriptors,
        current.descriptors,
        matches,
        2
    );

    let good = 0;

    /*
        Test Lowe'a.
        Odrzuca przypadkowe dopasowania.
    */

    for (
        let i = 0;
        i < matches.size();
        i++
    ) {

        const pair =
            matches.get(i);

        if (pair.size() < 2)
            continue;

        const first =
            pair.get(0);

        const second =
            pair.get(1);

        if (
            first.distance <
            0.72 * second.distance
        ) {

            good++;
        }
    }

    /*
        Sprzątanie pamięci OpenCV.
    */

    matcher.delete();

    template.orb.delete();
    template.keypoints.delete();
    template.descriptors.delete();

    current.orb.delete();
    current.keypoints.delete();
    current.descriptors.delete();

    return good;
}


/*
========================================
ANALIZA KAMERY
========================================
*/

const frameCanvas =
    document.createElement("canvas");

const frameCtx =
    frameCanvas.getContext("2d");


function analyze() {

    if (
        stream &&
        video.readyState >= 2 &&
        cvReady &&
        templateMat
    ) {

        /*
            Pobieramy mały obraz
            z kamery.
        */

        frameCanvas.width = 640;
        frameCanvas.height = 480;

        frameCtx.drawImage(
            video,
            0,
            0,
            640,
            480
        );

        let frame =
            cv.imread(
                frameCanvas
            );

        let gray =
            new cv.Mat();

        cv.cvtColor(
            frame,
            gray,
            cv.COLOR_RGBA2GRAY
        );

        frame.delete();

        /*
            Liczymy dopasowane cechy.
        */

        const good =
            compareWithTemplate(
                gray
            );

        gray.delete();

        scoreText.textContent =
            "Dopasowane cechy: " +
            good;

        /*
            Próg testowy.
            
            15+ dobrych cech:
            uznajemy za monetę.
        */

        if (good >= 15) {

            result.textContent =
                "🪙 ODBIERZ MONETĘ I PRZEJDŹ";

            result.style.background =
                "#087f23";

        } else {

            result.textContent =
                "SPADAJ STĄD";

            result.style.background =
                "#8b0000";
        }
    }

    setTimeout(
        () => requestAnimationFrame(analyze),
        300
    );
}


/*
========================================
PRZYCISKI
========================================
*/

document
    .getElementById("permission")
    .onclick =
    permission;

document
    .getElementById("start")
    .onclick =
    startCamera;

document
    .getElementById("stop")
    .onclick =
    stopCamera;

cameraSelect.addEventListener(
    "change",
    function () {

        if (stream)
            startCamera();
    }
);


/*
========================================
START
========================================
*/

permission();

analyze();

</script>

</body>
</html>
